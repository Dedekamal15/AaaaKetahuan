<script>
        // Set default date to today
        const dateInput = document.getElementById('tanggal');
        const today = new Date().toISOString().split('T')[0];
        dateInput.value = today;

        let currentType = 'out'; // Default is 'Keluar' (Expense)

        function setTransactionType(type) {
            currentType = type;
            const indicator = document.getElementById('toggle-indicator');
            const btnIn = document.getElementById('btn-masuk');
            const btnOut = document.getElementById('btn-keluar');
            const nominalInput = document.getElementById('nominal').parentElement;
            
            if (type === 'in') {
                indicator.style.transform = 'translateX(0)';
                btnIn.classList.add('text-primary');
                btnOut.classList.remove('text-expense-red');
                btnOut.classList.add('text-on-surface-variant');
                nominalInput.classList.replace('border-primary-container', 'border-primary-container');
                document.getElementById('icon-masuk').style.color = '#0d631b';
                document.getElementById('icon-keluar').style.color = 'inherit';
            } else {
                indicator.style.transform = 'translateX(100%)';
                btnOut.classList.add('text-expense-red');
                btnIn.classList.remove('text-primary');
                btnIn.classList.add('text-on-surface-variant');
                // Nominal indicator red for expense
                nominalInput.classList.remove('border-primary-container');
                nominalInput.classList.add('border-expense-red');
                document.getElementById('icon-keluar').style.color = '#D32F2F';
                document.getElementById('icon-masuk').style.color = 'inherit';
            }
        }

        // Init toggle
        setTransactionType('out');

        // Autocomplete Logic
        const suggestions = ["Kopi Susu", "Makan Siang", "Bensin", "Listrik", "Pulsa", "Susu Anak", "Vitamin", "Gaji Pokok", "Bonus", "Uang Saku"];
        const menu = document.getElementById('autocomplete-menu');
        const list = document.getElementById('suggestion-list');

        function showSuggestions(val) {
            if (!val) {
                menu.classList.add('hidden');
                return;
            }

            const filtered = suggestions.filter(s => s.toLowerCase().includes(val.toLowerCase()));
            
            if (filtered.length > 0) {
                list.innerHTML = '';
                filtered.forEach(item => {
                    const li = document.createElement('li');
                    li.className = "px-4 py-3 hover:bg-surface-container-low cursor-pointer font-body-md text-body-md text-on-surface";
                    li.textContent = item;
                    li.onclick = () => {
                        document.getElementById('nama-barang').value = item;
                        menu.classList.add('hidden');
                    };
                    list.appendChild(li);
                });
                menu.classList.remove('hidden');
            } else {
                menu.classList.add('hidden');
            }
        }

        // Close menu on click outside
        document.addEventListener('click', (e) => {
            if (!e.target.closest('#nama-barang')) {
                menu.classList.add('hidden');
            }
        });

        // Form Submit
        document.getElementById('transaction-form').onsubmit = (e) => {
            e.preventDefault();
            const btn = e.target.querySelector('button[type="submit"]');
            const originalContent = btn.innerHTML;
            
            btn.innerHTML = `<span class="material-symbols-outlined animate-spin">sync</span> Menyimpan...`;
            btn.disabled = true;

            setTimeout(() => {
                alert('Transaksi berhasil disimpan!');
                btn.innerHTML = originalContent;
                btn.disabled = false;
                e.target.reset();
                setTransactionType(currentType);
            }, 800);
        };
    </script>
