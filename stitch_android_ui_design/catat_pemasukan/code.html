<span class="font-headline-md text-headline-md text-on-surface-variant mr-2 mb-1">Rp</span>

</div>
</div>
<!-- Optional Notes Field -->
<div class="flex flex-col gap-2">
<label class="flex items-center gap-2 font-label-md text-label-md text-secondary uppercase tracking-wider pl-1" for="notes">
<div class="w-1 h-3 bg-outline-variant rounded-full"></div>
                    Catatan (Opsional)
                </label>
<div class="bg-surface-white rounded-xl shadow-sm border border-outline-variant/50 focus-within:border-primary focus-within:ring-1 focus-within:ring-primary transition-all">
<input class="w-full bg-transparent border-none rounded-xl px-4 py-3 font-body-lg text-body-lg text-on-background placeholder:text-on-surface-variant/50 focus:ring-0" id="notes" name="notes" placeholder="Contoh: Gaji April" type="text">
</div>
</div>

                    Tanggal
                </label>

<span class="material-symbols-outlined text-secondary mr-3 text-[20px]">calendar_today</span>
<input class="w-full bg-transparent border-none p-0 font-body-lg text-body-lg text-on-background cursor-pointer focus:ring-0 outline-none" id="date" name="date" readonly="" type="text" value="Senin, 22 Jun 2026">
</div>
</div>
<!-- Source Chips -->

<label class="flex items-center gap-2 font-label-md text-label-md text-secondary uppercase tracking-wider pl-1">

                </label>
<div class="flex flex-wrap gap-3">
<label class="cursor-pointer">
<input checked="" class="peer sr-only" name="source" type="radio" value="Gaji">

                        </div>
</label>
<label class="cursor-pointer">

<label class="cursor-pointer">

<span class="material-symbols-outlined text-[20px]">qr_code_2</span>

<script>
        // Simple script to format number input with thousand separators (optional enhancement)
        const amountInput = document.getElementById('amount');
        amountInput.addEventListener('input', function(e) {
            // Allow only numbers
            this.value = this.value.replace(/[^0-9]/g, '');
        });
